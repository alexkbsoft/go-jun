name: tasklist-prod

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: tasklist-migrate:${IMAGE_TAG:-latest}
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 30s
      retries: 10

  api:
    build: .
    image: tasklist-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_SERVER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["/app/api-server"]
    ports:
      - "127.0.0.1:8090:8090"

  outbox-poller:
    build: .
    image: tasklist-outbox-poller:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_SERVER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      API_SERVER_AMQP_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["/app/outbox-poller"]
  inbox-postgres:
      image: postgres:18.6
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${INBOX_POSTGRES_DB:-tasklist_inbox}
      volumes:
        - inbox_postgres_data:/var/lib/postgresql
      healthcheck:
        test: pg_isready -U ${POSTGRES_USER} -d ${INBOX_POSTGRES_DB:-tasklist_inbox} || exit 1
        interval: 5s 
        timeout: 5s 
        retries: 10

  inbox-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate.inbox
    image: tasklist-inbox-migrate:${IMAGE_TAG:-latest}
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inbox-postgres:5432/${INBOX_POSTGRES_DB:-tasklist_inbox}?sslmode=disable"
      - "up"
    depends_on:
      inbox-postgres:
        condition: service_healthy

  inbox-poller:
    build: .
    image: tasklist-inbox-poller:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INBOX_POLLER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inbox-postgres:5432/${INBOX_POSTGRES_DB:-tasklist_inbox}?sslmode=disable
      INBOX_POLLER_AMQP_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_CHAT_ID: ${MAX_CHAT_ID}
    depends_on:
      inbox-postgres:
        condition: service_healthy
      inbox-migrate: 
        condition: service_completed_successfully
      rabbitmq: 
        condition: service_healthy
    command: ["/app/inbox-poller"]


volumes:
  postgres_data:
  rabbitmq_data:
  inbox_postgres_data: